<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank — Вхід у систему</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo">💳 NeoBank</a>
        </header>

        <div id="alert-box" class="alert hidden"></div>

        <div class="card auth-card">
            <div class="tabs">
                <button class="tab active" id="tab-login" onclick="switchTab('login')">Вхід</button>
                <button class="tab" id="tab-register" onclick="switchTab('register')">Реєстрація</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="client@neobank.ua" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Увійти в банк</button>
            </form>

            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>ПІБ (Повне ім'я)</label>
                    <input type="text" id="reg-name" placeholder="Шахова Інна Євгенівна" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="client@neobank.ua" required>
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="text" id="reg-phone" placeholder="+380991234567">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" placeholder="Придумайте пароль" required>
                </div>
                <button type="submit" class="btn btn-primary full-width">Створити акаунт</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
